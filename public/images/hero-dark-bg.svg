<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4A0012" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#20050B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E0305" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#DBA3AE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#800020" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="maroonBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C47585" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#800020" stop-opacity="0"/>
    </linearGradient>
    <!-- Pattern for industrial blueprint/tech grid -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(219, 163, 174, 0.05)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(219, 163, 174, 0.15)"/>
    </pattern>
  </defs>

  <!-- Deep base background -->
  <rect width="1920" height="900" fill="#0E0305"/>
  <rect width="1920" height="900" fill="url(#heroGlow)"/>
  <rect width="1920" height="900" fill="url(#techGrid)"/>

  <!-- Atmospheric glowing orbs -->
  <circle cx="250" cy="200" r="320" fill="#800020" opacity="0.18" filter="blur(80px)"/>
  <circle cx="1650" cy="350" r="380" fill="#660019" opacity="0.22" filter="blur(90px)"/>
  <circle cx="960" cy="220" r="280" fill="#A3405A" opacity="0.12" filter="blur(70px)"/>

  <!-- Subtle industrial & tech silhouette lines in background -->
  <g opacity="0.25" stroke="#DBA3AE" stroke-width="1.5">
    <!-- Connecting network nodes -->
    <polyline points="120,480 340,320 520,380 720,240 890,290" fill="none" stroke-dasharray="4 4"/>
    <circle cx="120" cy="480" r="4" fill="#C47585"/>
    <circle cx="340" cy="320" r="5" fill="#DBA3AE"/>
    <circle cx="520" cy="380" r="4" fill="#C47585"/>
    <circle cx="720" cy="240" r="6" fill="#FFFFFF"/>
    <circle cx="890" cy="290" r="4" fill="#DBA3AE"/>

    <polyline points="1030,290 1200,240 1400,380 1580,320 1800,480" fill="none" stroke-dasharray="4 4"/>
    <circle cx="1030" cy="290" r="4" fill="#DBA3AE"/>
    <circle cx="1200" cy="240" r="6" fill="#FFFFFF"/>
    <circle cx="1400" cy="380" r="4" fill="#C47585"/>
    <circle cx="1580" cy="320" r="5" fill="#DBA3AE"/>
    <circle cx="1800" cy="480" r="4" fill="#C47585"/>
  </g>

  <!-- Modern office & lab silhouettes on lower sides -->
  <g opacity="0.12" fill="#EBCBD1">
    <!-- Left workspace silhouette -->
    <rect x="60" y="550" width="140" height="180" rx="4"/>
    <rect x="220" y="500" width="180" height="230" rx="4"/>
    <rect x="420" y="580" width="120" height="150" rx="4"/>
    <!-- Right manufacturing/lab silhouette -->
    <rect x="1380" y="570" width="130" height="160" rx="4"/>
    <rect x="1530" y="490" width="190" height="240" rx="4"/>
    <rect x="1740" y="560" width="120" height="170" rx="4"/>
  </g>

  <!-- Vignette overlay top and bottom -->
  <rect width="1920" height="160" fill="url(#maroonBeam)" opacity="0.3"/>
</svg>

